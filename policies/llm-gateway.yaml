# Agent that calls an LLM through your AI gateway and nothing else.
# Replace llm-gateway.example.com with your gateway host. The API key is never
# in the sandbox: attach it as an OpenShell provider so the supervisor injects
# it outside the workload (see docs/ENTERPRISE.md#credentials).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  llm_gateway:
    name: llm-gateway
    endpoints:
      - host: llm-gateway.example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/python3 }
